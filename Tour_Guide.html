<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tour guides · TravelU</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="menu.css">
  <link rel="stylesheet" href="filter.css">
</head>
<body data-tab="plan">
<div class="app wide">
  <header class="top">
    <a class="icon-btn" href="Plan.html" aria-label="Back"><i data-icon="back" class="lg"></i></a>
    <div><h1>Tour guides</h1><p class="sub">Local guides, group or private</p></div>
  </header>

  <main class="screen">
    <div class="grid-2">
      <div class="field"><label for="city">City</label><select id="city"></select></div>
      <div class="field"><label for="people">People</label>
        <select id="people"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
    </div>

    <div class="segmented" id="kind" role="group" aria-label="Tour type">
      <button type="button" aria-pressed="true" data-k="">All</button>
      <button type="button" aria-pressed="false" data-k="group">Group</button>
      <button type="button" aria-pressed="false" data-k="private">Private</button>
    </div>

    <div class="count-line">
      <p class="small strong" id="count"></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <label class="small strong">Language <select id="lang"><option value="">Any</option></select></label>
        <label class="small strong">Sort <select id="sort"><option value="rating">Best rated</option><option value="price">Cheapest</option></select></label>
      </div>
    </div>

    <div class="result-list" id="list"></div>
    <p class="note">Sample guides. Names and prices are made up.</p>
  </main>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="booking.js"></script>
<script>
  const trip = getTrip(param('trip'))
  fillCities($('#city'), 'Choose a city', false)
  if (trip && trip.to) $('#city').value = trip.to
  if (trip) $('#people').value = Math.min(6, trip.travellers)
  $('#lang').innerHTML += LANGS.map(l => `<option>${l}</option>`).join('')

  let kind = ''
  $('#kind').addEventListener('click', e => {
    const b = e.target.closest('button')
    if (!b) return
    kind = b.dataset.k
    $$('#kind button').forEach(x => x.setAttribute('aria-pressed', x === b))
    draw()
  })

  let guides = []
  function total(g) {
    // private tours are a flat price for the group up to 4, then per person
    const n = Number($('#people').value)
    return g.priv ? g.pp * Math.max(1, n - 3) * 2 : g.pp * n
  }

  function draw() {
    const city = $('#city').value
    if (!city) { $('#list').innerHTML = '<div class="empty">Choose a city to see guides.</div>'; $('#count').textContent = ''; return }
    guides = genGuides(city)
    let shown = guides.filter(g => (!kind || (kind === 'private') === g.priv) && (!$('#lang').value || g.langs.includes($('#lang').value)))
    shown.sort((a, b) => $('#sort').value === 'price' ? total(a) - total(b) : b.rating - a.rating)

    $('#count').textContent = plural(shown.length, 'guide') + ' in ' + getCity(city).name
    $('#list').innerHTML = shown.length ? shown.map(g => `
      <article class="card">
        <div class="result-head"><h3>${esc(g.title)}</h3><span class="rating">${icon('star', 'sm')} ${g.rating}</span></div>
        <div class="person" style="margin-top:10px"><span class="avatar">${initial(g.guide)}</span>
          <div><p class="strong">${esc(g.guide)}</p><p class="small muted">${g.langs.join(', ')} · ${g.size} · ${g.hours} hours</p></div></div>
        <div class="price-row">
          <div><p class="tiny muted">Total for ${plural(Number($('#people').value), 'person')}</p><p class="price">${money(total(g))}</p></div>
        </div>
        <div class="flags" style="margin-top:10px">${g.cancel.startsWith('Free') ? flag(g.cancel, 'ok') : flag(g.cancel)}${g.tip ? flag('Tip not included', 'warn') : ''}</div>
        ${actionRow(g)}
      </article>`).join('') : '<div class="empty">No guides match. Try another language.</div>'
  }

  wireCardActions($('#list'), id => guides.find(g => g.id === id), g => summarize({
    type: 'tour', id: g.id, title: g.title, sub: 'with ' + g.guide + ' · ' + g.hours + 'h · ' + plural(Number($('#people').value), 'person'),
    total: total(g), people: Number($('#people').value), city: g.city, date: trip ? trip.leave : ''
  }, { needDate: true }))

  ;['#city', '#people', '#lang', '#sort'].forEach(s => $(s).addEventListener('change', draw))
  draw()
</script>
</body>
</html>
